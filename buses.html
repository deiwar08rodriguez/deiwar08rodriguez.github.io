<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Buses | ThermoAir</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 🔤 Forzar mayúsculas visuales en todos los campos de texto */
        input[type="text"] {
            text-transform: uppercase;
        }

        /* --- 🖥️ DISEÑO BASE PARA COMPUTADORA --- */
        body {
            background: #203764;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            color: #1f2937;
        }

        header {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 35px;
            color: white;
        }

        .logo-area { display: flex; align-items: center; }
        .logo { height: 42px; width: auto; }
        .separador { width: 2px; height: 38px; background: rgba(255, 255, 255, .35); margin-left: 18px; margin-right: 18px; }
        .modulo { color: white; font-size: 30px; font-style: italic; font-weight: normal; }
        header a { color: white; text-decoration: none; font-size: 18px; }
        header a:hover { text-decoration: underline; }

        main {
            margin: 0 25px 25px 25px;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .25);
        }

        h2 { color: #203764; margin-bottom: 24px; font-size: 34px; font-weight: normal; }

        #txtBuscar {
            width: 100%;
            padding: 16px 22px;
            font-size: 17px;
            border: 2px solid #d2d9e6;
            border-radius: 10px;
            margin-bottom: 25px;
            outline: none;
            transition: .20s;
            text-transform: uppercase;
        }

        #txtBuscar:focus {
            border-color: #203764;
            box-shadow: 0 0 0 4px rgba(32, 55, 100, .15);
        }

        .lista-buses {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bus-item {
            border: 1px solid #d7dde8;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: box-shadow 0.2s;
        }

        .bus-item:hover {
            box-shadow: 0 6px 15px rgba(32, 55, 100, 0.1);
        }

        .bus-header {
            display: flex;
            align-items: stretch;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .bus-header:hover {
            background: #dfe9ff;
            transition: background 0.15s;
        }

        .bus-foto-wrapper {
            width: 100px; 
            aspect-ratio: 3 / 4; 
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            border-right: 1px solid #d7dde8;
            overflow: hidden;
            cursor: zoom-in; 
            transition: width 0.3s ease, aspect-ratio 0.3s ease;
        }

        .bus-foto { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            object-position: center;
        }

        .bus-item.abierto .bus-foto-wrapper {
            width: 140px; 
            aspect-ratio: 3 / 4;
        }

        .bus-foto-placeholder { color: #284B87; font-size: 13px; font-weight: bold; text-transform: uppercase; }
        
        .bus-info-main { 
            flex-grow: 1; 
            padding: 15px 45px 15px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .bus-titulo { font-size: 19px; color: #1e3a8a; font-weight: bold; margin-bottom: 2px; }
        .bus-detalles-linea1 { font-size: 13px; color: #3b82f6; margin-bottom: 4px; text-transform: uppercase; }
        .bus-detalles-linea2 { font-size: 13px; font-weight: bold; color: #203764; }
        
        .solo-gestion {
            display: inline !important;
        }
        body.rol-tecnico .solo-gestion {
            display: none !important;
        }

        .bus-flecha { 
            font-size: 16px; 
            color: #284B87; 
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            transition: transform 0.2s; 
        }
        .bus-item.abierto .bus-flecha { transform: translateY(-50%) rotate(180deg); }

        .bus-detalle-panel {
            display: none;
            padding: 20px;
            background: #fafbfc;
            border-top: 1px solid #e6ebf2;
        }

        .bus-item.abierto .bus-detalle-panel { display: block; }

        /* --- 📑 PESTAÑAS INTERNAS (INVENTARIO / SERVICIOS) --- */
        .panel-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #64748b;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #284B87;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .table-container {
            border-radius: 8px;
            overflow: auto;
            border: 1px solid #d7dde8;
            max-height: 40vh;
            background: white;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead th { background: #284B87; color: white; padding: 12px; position: sticky; top: 0; text-align: left; z-index: 10; font-size: 13px; letter-spacing: .5px;}
        tbody td { padding: 10px 12px; border-bottom: 1px solid #e6ebf2; color: #203764; }
        tbody tr:nth-child(even) { background: #fafbfc; }
        tbody tr:hover { background: #dfe9ff; transition: .15s; }

        .col-codigo { font-weight: bold; color: #284B87; }
        .col-descripcion { font-weight: bold; color: #1e3a8a; }
        .col-recibe { color: #3b82f6; font-weight: bold; }
        .cantidad { text-align: center; font-weight: bold; color: #284B87; }
        .precio { text-align: right; font-family: Consolas, monospace; font-weight: bold; color: #203764; }

        body.rol-tecnico th.precio, 
        body.rol-tecnico td.precio,
        body.rol-tecnico .salida-precio,
        body.rol-tecnico .panel-acciones,
        body.rol-tecnico #btnAbrirFlotante { 
            display: none !important; 
        }

        .panel-acciones { 
            display: flex; 
            justify-content: flex-end; 
            margin-top: 15px; 
        }

        .btn-facturar {
            background: #284B87;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(40, 75, 135, 0.2);
        }

        .btn-facturar:hover { 
            background: #203764; 
        }

        .mobile-cards-salidas { display: none; }

        /* ═══════════════════════════════════
           MENÚ CONTEXTUAL (DOBLE CLIC)
           ═══════════════════════════════════ */
        #menuContextual {
            display: none;
            position: fixed;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.18);
            z-index: 2000;
            overflow: hidden;
            min-width: 160px;
            border: 1px solid #e2e8f0;
        }
        #menuContextual.visible { display: block; }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #203764;
        }
        .menu-item:hover { background: #f1f5f9; }
        .menu-item.danger { color: #dc2626; }
        .menu-item.danger:hover { background: #fef2f2; }
        .menu-sep { height: 1px; background: #f1f5f9; margin: 0; }

        /* ═══════════════════════════════════
           SHEET MODAL PARA EDITAR / CREAR BUS
           ═══════════════════════════════════ */
        #overlaySheet {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 1000;
        }
        #overlaySheet.visible { display: block; }

        #hojaSheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 25px rgba(0,0,0,.2);
            z-index: 1001;
            transition: bottom .3s ease-out;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        #hojaSheet.visible { bottom: 0; }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: #cbd5e1;
            border-radius: 3px;
            margin: 10px auto 4px auto;
            flex-shrink: 0;
            cursor: pointer;
        }

        .sheet-titulo {
            color: #203764;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 8px 16px;
            border-bottom: 1px solid #f1f5f9;
            flex-shrink: 0;
        }

        .sheet-body { 
            padding: 16px; 
            overflow-y: auto; 
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .campo { display: flex; flex-direction: column; }
        .campo label {
            font-size: 11px;
            font-weight: bold;
            color: #203764;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .campo input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            background: white;
            text-transform: uppercase;
        }
        .campo input:focus { border-color: #284B87; }

        .campo-foto {
            background: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .preview-camera-box {
            width: 120px; 
            aspect-ratio: 3 / 4; 
            background: #e2e8f0; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            overflow: hidden; 
            position: relative; 
            border: 2px solid #284B87;
        }
        .preview-camera-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 1;
        }
        .preview-camera-box::before {
            content: ''; 
            position: absolute; 
            top: 6px; 
            left: 6px; 
            right: 6px; 
            bottom: 6px; 
            border: 2px solid transparent; 
            border-image: linear-gradient(to bottom right, #ffffff 15%, transparent 16%, transparent 84%, #ffffff 85%) 1; 
            pointer-events: none; 
            z-index: 5;
        }

        .btn-confirmar {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-confirmar:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* ═══════════════════════════════════
           TOAST
           ═══════════════════════════════════ */
        #toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            z-index: 3000;
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 📱 REGLAS CELULAR */
        @media (max-width: 768px) {
            body { background: white; }
            header { background: #203764; height: 65px; padding: 0 15px; }
            .logo { height: 32px; }
            .separador { height: 26px; margin-left: 10px; margin-right: 10px; }
            .modulo { font-size: 20px; }
            header a { font-size: 14px; }
            main { margin: 0; padding: 15px; border-radius: 0; box-shadow: none; background: white; }
            h2 { font-size: 24px; margin-bottom: 15px; }
            #txtBuscar { padding: 14px 18px; font-size: 16px; margin-bottom: 15px; }
            .bus-detalle-panel { padding: 12px 5px; }
            .table-container { display: none; }
            .mobile-cards-salidas { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
            .salida-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; position: relative; }
            .salida-desc { font-size: 14px; font-weight: bold; color: #1e3a8a; margin-bottom: 2px; padding-right: 70px; }
            .salida-sub { font-size: 11px; color: #3b82f6; text-transform: uppercase; }
            .salida-precio { font-size: 15px; font-weight: bold; color: #203764; margin-top: 4px; }
            .salida-codigo-badge { position: absolute; top: 10px; right: 10px; background: #e2e8f0; color: #284B87; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid #cbd5e1; }
            .salida-footer { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #284B87; margin-top: 6px; border-top: 1px dashed #cbd5e1; padding-top: 4px; }
            .btn-facturar { width: 100%; text-align: center; padding: 12px; }

            #hojaSheet { 
                max-width: 100%; 
                max-height: 92vh; 
                border-radius: 16px 16px 0 0; 
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-area">
            <img src="Logo/Imagotipo_ThermoAir.svg" alt="ThermoAir" class="logo">
            <div class="separador"></div>
            <div class="modulo">Gestión</div>
        </div>
        <a href="index_gestion.html">← Menú principal</a>
    </header>

    <main>
        <h2>Monitoreo de Buses</h2>
        <input type="text" id="txtBuscar" placeholder="BUSCAR POR BUS, PLACA O CLIENTE...">
        <div class="lista-buses" id="contenedorBuses"></div>
    </main>

    <button id="btnAbrirFlotante" style="position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #284B87; color: white; border: none; border-radius: 50%; font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.35); z-index: 999; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;">
        +
    </button>

    <!-- SHEET MODAL PARA CREAR Y EDITAR BUS -->
    <div id="overlaySheet"></div>
    <div id="hojaSheet">
        <div class="sheet-handle" id="sheetHandle"></div>
        <div class="sheet-titulo" id="sheetTitulo">Editar Bus</div>
        
        <div class="sheet-body">
            <div class="campo-foto" onclick="document.getElementById('editFoto').click()" title="Haz clic para seleccionar o tomar foto">
                <input type="file" id="editFoto" accept="image/*" style="display: none;">
                <div class="preview-camera-box" id="previewEditFoto">
                    <span id="iconEditCamara" style="font-size: 32px;">📸</span>
                </div>
                <span id="lblTextoFoto" style="font-size: 13px; color: #284B87; font-weight: bold; cursor: pointer;">CAMBIAR FOTO</span>
            </div>

            <div class="campo">
                <label>Nombre del Bus</label>
                <input type="text" id="editBus" placeholder="EJ: BUS GENERICO 1234">
            </div>

            <div class="campo">
                <label>Placa</label>
                <input type="text" id="editPlaca" placeholder="EJ: ABC-123">
            </div>

            <div class="campo">
                <label>Cliente</label>
                <input type="text" id="editCliente" placeholder="Nombre del cliente">
            </div>

            <button class="btn-confirmar" id="btnConfirmarEdicion">Guardar cambios</button>
        </div>
    </div>

<!-- MENÚ CONTEXTUAL DOBLE CLIC -->
    <div id="menuContextual">
        <div class="menu-item" onclick="editarBusDesdeMenu()">✏️ Editar</div>
        <div class="menu-sep"></div>
        <div class="menu-item danger" onclick="archivarBusDesdeMenu()">📦 Archivar</div>
    </div>

    <!-- VISOR DE IMAGEN -->
    <div id="visorImagenModal" onclick="this.style.display='none'" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; cursor: zoom-out;">
        <img id="imgVisorCompleto" src="" style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <script>
        // --- 🔤 CONVERSIÓN AUTOMÁTICA A MAYÚSCULAS EN TIEMPO REAL ---
        document.addEventListener("input", function (e) {
            if (e.target.tagName === "INPUT" && e.target.type === "text") {
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                e.target.value = e.target.value.toUpperCase();
                e.target.setSelectionRange(start, end);
            }
        });

        // --- 🛡️ CONTROL DE ACCESO Y ROL EN VISTA ---
        (function() {
            const sessionUser = sessionStorage.getItem("session_user");
            const sessionArea = sessionStorage.getItem("session_area");

            if (!sessionUser || !sessionArea) {
                window.location.href = "index.html";
                return;
            }

            const area = sessionArea.toLowerCase().trim();
            if (area === "tecnico") {
                document.body.classList.add("rol-tecnico");
                const modTitulo = document.querySelector(".modulo");
                if (modTitulo) modTitulo.innerText = "Técnico";
            }
        })();

        // Redirección directa al presionar Facturar
        function abrirPasarelaFacturacion(idBus, nombreBus, placaBus) {
            if (typeof lanzarFacturacionSiigo === "function") {
                lanzarFacturacionSiigo(idBus, { nombre: nombreBus, placa: placaBus });
            } else {
                window.location.href = "facturas_ventas.html";
            }
        }
    </script>

    <script src="buses.js"></script>
</body>
</html>
